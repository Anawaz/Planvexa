apiVersion: v1
kind: Service
metadata:
  name: {{ include "planvexa.api.fullname" . }}
  labels:
    {{- include "planvexa.api.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "planvexa.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.containerPort }}

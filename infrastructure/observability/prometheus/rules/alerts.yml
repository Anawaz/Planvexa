# Deliberately a handful of rules, not an exhaustive rule set -- see infrastructure/observability/README.md.
# Prometheus evaluates these and exposes firing alerts at http://localhost:9090/alerts; wire a
# notification channel (Alertmanager, Grafana alerting contact points, etc.) separately -- that's
# deployment-specific and out of scope here.
groups:
  - name: planvexa-api
    rules:
      - alert: PlanvexaApiHighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Planvexa API 5xx rate above 5%"
          description: "More than 5% of API requests have returned a 5xx status over the last 5 minutes."

      - alert: PlanvexaApiHighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Planvexa API p99 latency above 2s"
          description: "The 99th percentile request duration has exceeded 2 seconds for 5 minutes."

  - name: planvexa-availability
    rules:
      - alert: PlanvexaServiceUnreachable
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is unreachable"
          description: "The blackbox probe against {{ $labels.instance }} has failed for 2 minutes."

      - alert: PlanvexaMetricsPipelineDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpenTelemetry collector scrape target down"
          description: "Prometheus cannot scrape otel-collector; API/Postgres metrics are blind until this recovers."

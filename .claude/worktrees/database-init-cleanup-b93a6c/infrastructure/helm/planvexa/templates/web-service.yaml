apiVersion: v1
kind: Service
metadata:
  name: {{ include "planvexa.web.fullname" . }}
  labels:
    {{- include "planvexa.web.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "planvexa.web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.containerPort }}
